<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060A18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ascension</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFFB; --panel:#F7FAFF; --panel2:#DCE6FA; --line:#9DB4E0;
  --accent:#0B6FD6; --accent-ink:#FFFFFF; --soft:rgba(11,111,214,.10); --glow:rgba(11,111,214,.18);
  --text:#0C1A3A; --muted:#52668F; --danger:#C8203F; --danger-soft:rgba(200,32,63,.10);
  --gold:#9A6A00; --gold-soft:rgba(154,106,0,.12);
  --display:"Chakra Petch", "Rajdhani", "Segoe UI", Roboto, sans-serif;
  --body:"Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060A18; --panel:#0B1430; --panel2:#13204A; --line:#27468A;
    --accent:#53D2FF; --accent-ink:#04122B; --soft:rgba(83,210,255,.10); --glow:rgba(83,210,255,.30);
    --text:#DDE8FF; --muted:#8196C2; --danger:#FF5A78; --danger-soft:rgba(255,90,120,.12);
    --gold:#FFCB5C; --gold-soft:rgba(255,203,92,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#060A18; --panel:#0B1430; --panel2:#13204A; --line:#27468A;
  --accent:#53D2FF; --accent-ink:#04122B; --soft:rgba(83,210,255,.10); --glow:rgba(83,210,255,.30);
  --text:#DDE8FF; --muted:#8196C2; --danger:#FF5A78; --danger-soft:rgba(255,90,120,.12);
  --gold:#FFCB5C; --gold-soft:rgba(255,203,92,.12);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%, var(--soft), transparent 70%);
  color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:12px 14px 110px}

/* en tête */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--accent);text-shadow:0 0 18px var(--glow)}
.who{font-family:var(--display);font-size:14px;color:var(--muted);text-align:right;line-height:1.2}
.who b{color:var(--text);font-weight:600;display:block;font-size:15px}

/* fenêtre système : la signature visuelle */
.win{
  position:relative;background:var(--panel);border:1px solid var(--line);
  padding:16px 16px 18px;margin:0 0 16px;
  box-shadow:0 0 0 1px var(--soft), 0 8px 30px -12px var(--glow), inset 0 0 40px -20px var(--glow);
}
.win::before,.win::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--accent);pointer-events:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win.danger{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger-soft),0 8px 30px -12px var(--danger-soft)}
.win.danger::before,.win.danger::after{border-color:var(--danger)}
.win-h{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 12px}
.sig{display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid currentColor;font-size:15px;color:var(--accent);flex:none}
.danger .sig{color:var(--danger)}
.flavor{color:var(--muted);font-style:italic;margin:-4px 0 14px}

/* statut */
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.rank{width:92px;height:104px;display:grid;place-items:center;position:relative;
  clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);background:var(--accent);}
.rank::before{content:"";position:absolute;inset:3px;background:var(--panel);clip-path:inherit}
.rank-l{position:relative;font-family:var(--display);font-weight:700;font-size:58px;line-height:1;color:var(--accent);text-shadow:0 0 22px var(--glow)}
.lvl{font-family:var(--display);font-size:15px;color:var(--muted)}
.lvl b{display:block;font-size:44px;line-height:1;color:var(--text);font-weight:700}
.ttl{color:var(--gold);font-family:var(--display);font-size:15px;margin-top:4px}
.bar{height:8px;background:var(--panel2);position:relative;overflow:hidden;margin-top:14px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);box-shadow:0 0 12px var(--glow);transition:width .4s ease}
.bar.full i{background:var(--gold)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

.stats{display:grid;gap:10px}
.stat{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--panel2)}
.stat:last-child{border-bottom:0}
.stat .k{font-family:var(--display);font-weight:600}
.stat .k small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:right}
.plus{width:38px;height:38px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:22px;line-height:1;font-family:var(--display)}
.plus:disabled{opacity:.25;cursor:default}
.pts{margin:0 0 6px;color:var(--gold);font-family:var(--display)}
.pts.none{color:var(--muted)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cell{background:var(--panel2);padding:12px}
.cell .n{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.cell .l{font-size:14px;color:var(--muted)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;
  background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.warn{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{opacity:.4;cursor:default}

/* quête */
.ex{padding:12px 0 14px;border-top:1px solid var(--panel2)}
.flavor+.ex{border-top:0;padding-top:4px}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-n{font-family:var(--display);font-weight:600;font-size:18px}
.ex-n small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.ex-c{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:18px;white-space:nowrap}
.ex-c.ok{color:var(--gold)}
.ex .bar{margin-top:8px}
.ex-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ex-btns button{flex:1;min-width:56px;height:44px;background:var(--soft);border:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:16px}
.ex-btns button.minus{flex:0 0 48px;color:var(--muted)}
.ex-btns button.chrono{flex:2}
.ex-btns button.chrono.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ex-btns button:disabled{opacity:.35;cursor:default}
.ex-max{margin:6px 0 0;font-size:12px;color:var(--muted)}
.win.locked .ex{opacity:.55}
.lock-note{margin:4px 0 6px;padding:10px 12px;border:1px solid var(--danger);color:var(--danger);font-size:14px;display:flex;gap:8px;align-items:center}
.danger .ex-btns button{background:var(--danger-soft);border-color:var(--danger)}
.danger .bar i{background:var(--danger)}
.reward{font-size:14px;color:var(--muted);margin:12px 0 0}
.clock{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--text)}
.cleared{display:flex;align-items:center;gap:10px;color:var(--gold);font-family:var(--display);font-weight:600;margin-top:10px}

/* donjons */
.gate{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.gate-r{width:54px;height:62px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;border:1.5px solid var(--accent);color:var(--accent);
  clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);background:var(--soft)}
.gate.locked{opacity:.55}
.gate.locked .gate-r{color:var(--muted);border-color:var(--muted);background:transparent}
.gate h3{margin:0;font-family:var(--display);font-size:19px;font-weight:600}
.gate p{margin:4px 0 10px;color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);margin:0 6px 6px 0}
.tag.gold{border-color:var(--gold);color:var(--gold)}

/* journal */
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;background:var(--panel2);display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.done{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 10px var(--glow)}
.day.miss{background:transparent;border:1px dashed var(--danger);color:var(--danger)}
.day.none{opacity:.35}
.day.today{outline:2px solid var(--gold);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--panel2)}
.legend .l1::before{background:var(--accent)}
.legend .l2::before{background:transparent;border:1px dashed var(--danger)}
.ach{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--panel2)}
.ach:last-child{border-bottom:0}
.ach .ic{width:30px;height:30px;display:grid;place-items:center;border:1.5px solid var(--gold);color:var(--gold);font-family:var(--display);font-size:14px}
.ach.lock .ic{border-color:var(--line);color:var(--muted)}
.ach.lock{color:var(--muted)}
.ach b{font-family:var(--display);font-weight:600;display:block}
.ach small{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 14px}
.seg button{min-height:44px;background:transparent;border:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note-s{font-size:14px;color:var(--muted)}
.xfer{height:96px;padding:10px 12px;font-size:13px;line-height:1.35;resize:none;word-break:break-all}
.field{display:block;width:100%;height:50px;padding:0 14px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:18px;margin:6px 0 14px}

/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:transparent;border:0;padding:10px 0 12px;display:grid;justify-items:center;gap:3px;font-family:var(--display);font-size:12px;font-weight:600;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--accent);box-shadow:0 0 10px var(--glow)}
.dot{position:absolute;top:8px;right:calc(50% - 20px);width:8px;height:8px;background:var(--danger);border-radius:50%}

/* fenêtres superposées */
.layer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:rgba(3,6,16,.72);backdrop-filter:blur(4px)}
.layer[hidden]{display:none}
.layer .win{width:100%;max-width:420px;margin:0;max-height:100%;overflow:auto}
.pop{animation:pop .28s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.note-big{font-family:var(--display);font-size:24px;font-weight:700;margin:0 0 6px;color:var(--accent)}
.note-big.gold{color:var(--gold)}
.note-big.red{color:var(--danger)}
.note-p{margin:0 0 18px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* donjon en cours */
.run{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.run[hidden]{display:none}
.run-name{font-family:var(--display);color:var(--muted);font-size:15px}
.run-phase{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;min-height:2.3em;display:grid;place-items:center}
.ring{width:min(72vw,300px);height:min(72vw,300px);position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:min(22vw,92px);font-variant-numeric:tabular-nums}
.run-next{color:var(--muted);min-height:1.5em}
.run-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px;margin-top:8px}
.win.gold{border-color:var(--gold)}
.win.gold::before,.win.gold::after{border-color:var(--gold)}
.gold .sig{color:var(--gold)}
.gold .ex-btns button{background:var(--gold-soft);border-color:var(--gold)}
.gold .bar i{background:var(--gold)}
.hp{height:14px;background:var(--panel2);position:relative;overflow:hidden;margin:10px 0 6px;border:1px solid var(--danger)}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--danger);transition:width .5s ease}
.boss-n{font-family:var(--display);font-weight:700;font-size:24px;margin:0}
.q{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;margin-left:6px;vertical-align:2px;padding:0;font-family:var(--display)}
button.tag{background:transparent;font-family:var(--body);cursor:pointer}
.day.rest{background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold)}
.legend .l3::before{background:var(--gold-soft);border:1px solid var(--gold)}
.note-num{font-family:var(--display);font-weight:700;font-size:96px;line-height:1;text-align:center;color:var(--gold);text-shadow:0 0 30px var(--gold-soft),0 0 60px var(--glow);margin:4px 0 10px;animation:rise .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.6)}to{opacity:1;transform:none}}
.inv{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.inv .tok{display:flex;gap:4px}
.inv .tok i{width:14px;height:14px;border:1.5px solid var(--gold);transform:rotate(45deg)}
.inv .tok i.on{background:var(--gold);box-shadow:0 0 8px var(--gold-soft)}
.cls-list{display:grid;gap:10px}
.cls{text-align:left;padding:12px 14px;background:var(--soft);border:1px solid var(--line)}
.cls b{display:block;font-family:var(--display);font-size:19px;color:var(--accent)}
.cls small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.cls-tag{color:var(--accent);font-family:var(--display);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--display);fill:var(--muted);font-size:11px}
.chart .cur{fill:var(--accent)}
.chart .old{fill:var(--line)}
.chart .val{fill:var(--text);font-size:11px}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--panel2);align-items:baseline}
.rec:last-child{border-bottom:0}
.rec b{font-family:var(--display);font-weight:600}
.rec .t{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rec small{color:var(--muted);font-size:13px;grid-column:1/-1}
:root[data-skin="violet"]{--accent:#6B3FD4;--soft:rgba(107,63,212,.10);--glow:rgba(107,63,212,.20)}
:root[data-skin="braise"]{--accent:#C45A00;--soft:rgba(196,90,0,.10);--glow:rgba(196,90,0,.20)}
:root[data-skin="jade"]{--accent:#0A8F5A;--soft:rgba(10,143,90,.10);--glow:rgba(10,143,90,.20)}
@media (prefers-color-scheme: dark){
  :root[data-skin="violet"]:not([data-theme="light"]){--accent:#B79BFF;--accent-ink:#1A0B3A;--soft:rgba(183,155,255,.10);--glow:rgba(183,155,255,.30)}
  :root[data-skin="braise"]:not([data-theme="light"]){--accent:#FF9F43;--accent-ink:#2A1200;--soft:rgba(255,159,67,.10);--glow:rgba(255,159,67,.30)}
  :root[data-skin="jade"]:not([data-theme="light"]){--accent:#3DDC97;--accent-ink:#022416;--soft:rgba(61,220,151,.10);--glow:rgba(61,220,151,.30)}
}
:root[data-theme="dark"][data-skin="violet"]{--accent:#B79BFF;--accent-ink:#1A0B3A;--soft:rgba(183,155,255,.10);--glow:rgba(183,155,255,.30)}
:root[data-theme="dark"][data-skin="braise"]{--accent:#FF9F43;--accent-ink:#2A1200;--soft:rgba(255,159,67,.10);--glow:rgba(255,159,67,.30)}
:root[data-theme="dark"][data-skin="jade"]{--accent:#3DDC97;--accent-ink:#022416;--soft:rgba(61,220,151,.10);--glow:rgba(61,220,151,.30)}
.top-r{display:flex;align-items:center;gap:12px}
.coin{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--gold);font-family:var(--display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.coin i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.shop-i{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--panel2)}
.shop-i:last-child{border-bottom:0}
.shop-i b{font-family:var(--display);font-weight:600;font-size:17px}
.shop-i small{color:var(--muted);font-size:14px;grid-column:1}
.shop-i .buy{grid-row:1/3;grid-column:2;min-width:96px;height:44px;border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--gold);font-family:var(--display);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.shop-i .buy:disabled{opacity:.35;cursor:default}
.shop-i .buy.eq{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.swatch{display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;transform:rotate(45deg)}
.comp{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--panel2)}
.comp:last-child{border-bottom:0}
.comp .av{width:40px;height:46px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:15px}
.comp.lock .av{background:var(--panel2);color:var(--muted)}
.comp b{font-family:var(--display);font-weight:600;display:block}
.comp small{color:var(--muted);font-size:13px}
.comp.lock b{color:var(--muted)}
.rift-note{display:flex;gap:10px;align-items:center;color:var(--danger);font-family:var(--display);font-weight:600;margin:0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 14px}
.wk button{height:44px;background:transparent;border:1px solid var(--line);font-family:var(--display);font-weight:600}
.wk button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
:root[data-skin="aurore"]{--accent:#C2185B;--soft:rgba(194,24,91,.10);--glow:rgba(194,24,91,.20)}
:root[data-skin="abysse"]{--accent:#007D73;--soft:rgba(0,125,115,.10);--glow:rgba(0,125,115,.20)}
:root[data-skin="seve"]{--accent:#4C7A00;--soft:rgba(76,122,0,.10);--glow:rgba(76,122,0,.20)}
:root[data-skin="nebuleuse"]{--accent:#3F51B5;--soft:rgba(63,81,181,.10);--glow:rgba(63,81,181,.20)}
@media (prefers-color-scheme: dark){
  :root[data-skin="aurore"]:not([data-theme="light"]){--accent:#FF7EB6;--accent-ink:#2B0616;--soft:rgba(255,126,182,.10);--glow:rgba(255,126,182,.30)}
  :root[data-skin="abysse"]:not([data-theme="light"]){--accent:#2EC4B6;--accent-ink:#021F1C;--soft:rgba(46,196,182,.10);--glow:rgba(46,196,182,.30)}
  :root[data-skin="seve"]:not([data-theme="light"]){--accent:#B5E550;--accent-ink:#1A2600;--soft:rgba(181,229,80,.10);--glow:rgba(181,229,80,.30)}
  :root[data-skin="nebuleuse"]:not([data-theme="light"]){--accent:#8FA2FF;--accent-ink:#0B1033;--soft:rgba(143,162,255,.10);--glow:rgba(143,162,255,.30)}
}
:root[data-theme="dark"][data-skin="aurore"]{--accent:#FF7EB6;--accent-ink:#2B0616;--soft:rgba(255,126,182,.10);--glow:rgba(255,126,182,.30)}
:root[data-theme="dark"][data-skin="abysse"]{--accent:#2EC4B6;--accent-ink:#021F1C;--soft:rgba(46,196,182,.10);--glow:rgba(46,196,182,.30)}
:root[data-theme="dark"][data-skin="seve"]{--accent:#B5E550;--accent-ink:#1A2600;--soft:rgba(181,229,80,.10);--glow:rgba(181,229,80,.30)}
:root[data-theme="dark"][data-skin="nebuleuse"]{--accent:#8FA2FF;--accent-ink:#0B1033;--soft:rgba(143,162,255,.10);--glow:rgba(143,162,255,.30)}
.note-big.r0,.note-num.r0{color:#9AA8C7}.note-big.r1,.note-num.r1{color:#4DA3FF}.note-big.r2,.note-num.r2{color:#B07CFF}.note-big.r3,.note-num.r3{color:#FFC53D}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--panel2)}
.item:last-child{border-bottom:0}
.item .rb{grid-row:1/3;align-self:stretch;width:4px}
.item b{font-family:var(--display);font-weight:600;font-size:16px}
.item small{grid-column:2;color:var(--muted);font-size:13px}
.item .acts{grid-row:1/3;grid-column:3;display:flex;gap:6px}
.item .acts button{height:40px;padding:0 10px;background:var(--soft);border:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:13px}
.item .acts button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slot{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--panel2)}
.slot:last-of-type{border-bottom:0}
.slot .sl{font-family:var(--display);font-size:13px;color:var(--muted)}
.slot b{font-family:var(--display);font-weight:600;display:block}
.slot small{color:var(--muted);font-size:13px}
.skill{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--panel2)}
.skill:last-child{border-bottom:0}
.skill .ic{width:30px;height:30px;display:grid;place-items:center;border:1.5px solid var(--accent);color:var(--accent);font-family:var(--display);font-size:14px}
.skill.on .ic{background:var(--accent);color:var(--accent-ink)}
.skill.lock{opacity:.5}
.skill b{font-family:var(--display);font-weight:600;display:block}
.skill small{color:var(--muted);font-size:13px}
.skill button{height:40px;padding:0 12px;border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--gold);font-family:var(--display);font-weight:700;font-size:13px}
.life{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--panel2);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.life:last-child{border-bottom:0}
.life .bx{width:26px;height:26px;border:1.5px solid var(--accent);display:grid;place-items:center;font-size:15px;color:var(--accent-ink)}
.life.on .bx{background:var(--accent)}
.life.on b{color:var(--muted);text-decoration:line-through}
.life b{font-family:var(--display);font-weight:600;display:block}
.life small{color:var(--muted);font-size:13px}
.wq{padding:10px 0;border-bottom:1px solid var(--panel2)}
.wq:last-of-type{border-bottom:0}
.wq .ex-top b{font-family:var(--display);font-weight:600}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.pal div{background:var(--panel2);padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);line-height:1.25}
.pal div b{display:block;font-family:var(--display);font-size:16px;color:var(--text)}
.pal div.ok{background:var(--gold-soft);color:var(--gold)}
.pal div.ok b{color:var(--gold)}
.exin{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-top:10px}
.exin .field{margin:0;height:48px;text-align:center;font-family:var(--display);font-size:22px}
.res{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--panel2);align-items:baseline}
.res:last-of-type{border-bottom:0}
.res b{font-family:var(--display);font-weight:600}
.res .t{font-family:var(--display);font-size:20px;font-weight:700}
.res .dl{font-family:var(--display);font-size:14px;color:var(--gold);min-width:4ch;text-align:right}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</nav>

<div class="layer" id="note" hidden>

<div class="layer" id="onb" hidden><div class="win pop" id="onbWin"></div></div>

</div>

function pad(n){return String(n).padStart(2,"0")}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return dkey(new Date())}
function addDays(k,n){var p=k.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return dkey(d)}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function weekKey(k){var p=k.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)}
function wdOf(k){var p=k.split("-");return (new Date(+p[0],+p[1]-1,+p[2]).getDay()+6)%7}
function rankIdx(lv){var i=0;for(var j=0;j<RANK_LV.length;j++){if(lv>=RANK_LV[j])i=j}return i}
function need(lv){return 100+(lv-1)*40}
function roundU(v,u){
  if(u==="s")return Math.max(15,Math.round(v/15)*15);
  if(u==="min")return Math.max(5,Math.round(v/5)*5);
  return v<20?Math.max(1,Math.round(v)):Math.round(v/5)*5;
}
function fmtU(v,u){
  if(u==="s"){if(v>=60){var m=Math.floor(v/60),s=v%60;return m+" min"+(s?" "+pad(s):"")}return v+" s"}
  if(u==="min")return v+" min";
  return String(v);
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

var LS="ascension.v1";

var docRef=null, saveTimer=null, saving=false, again=false, syncMode="local";

function migrate(){if(!S)return;if(S.tokens==null)S.tokens=0;if(S.bossWins==null)S.bossWins=0;if(S.secDone==null)S.secDone=0;if(S.sound==null)S.sound=true;if(S.voice==null)S.voice=true;if(!S.arch)S.arch={tot:{},best:{}};if(!S.xpLog)S.xpLog={};if(S.dgSec==null)S.dgSec=0;
  if(S.gold==null){S.gold=countDone()*30+S.dgCount*20+S.bossWins*150;S.goldTotal=S.gold;if(S.gold>0)note("Trésor du Système","Pour tes exploits passés, le Système te verse "+S.gold+" or. Touche le compteur doré en haut pour ouvrir la boutique.","gold")}
  if(S.goldTotal==null)S.goldTotal=S.gold;
  if(!S.skins)S.skins=["cyan"];if(!S.skin)S.skin="cyan";
  if(!S.comp){S.comp={};if(S.boss&&S.boss.won&&COMP[S.boss.name])S.comp[S.boss.name]=1}
  if(!S.restDays)S.restDays=[];if(S.unstableDone==null)S.unstableDone=0;if(S.bought==null)S.bought=0;

  if(!S.stitles)S.stitles=[];if(S.lifeDays==null)S.lifeDays=0;if(!S.remTime)S.remTime="18:00";if(S.wqAll==null)S.wqAll=0;
  if(S.boss&&S.boss.over==null)S.boss.over=0;if(S.season&&!S.season.rc)S.season.rc={};if(S.wq&&!S.wq.rc)S.wq.rc={};

function dayAmounts(d){
  var o={};if(!d)return o;
  [d.p,d.pen&&d.pen.p,d.sec&&d.sec.p].forEach(function(p){if(p)for(var k in p){if(EX[k])o[k]=(o[k]||0)+p[k]}});
  return o;
}
function foldArch(k){
  var a=dayAmounts(S.days[k]);
  for(var ex in a){S.arch.tot[ex]=(S.arch.tot[ex]||0)+a[ex];var b=S.arch.best[ex];if(!b||a[ex]>b.v)S.arch.best[ex]={v:a[ex],d:k}}
}
function computeStats(){
  var tot=JSON.parse(JSON.stringify(S.arch.tot)),best=JSON.parse(JSON.stringify(S.arch.best));
  Object.keys(S.days).forEach(function(k){
    var a=dayAmounts(S.days[k]);
    for(var ex in a){tot[ex]=(tot[ex]||0)+a[ex];if(a[ex]>0&&(!best[ex]||a[ex]>best[ex].v))best[ex]={v:a[ex],d:k}}
  });
  return {tot:tot,best:best};
}
function loadLocal(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function writeLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function save(){
  if(!S)return;
  S.updatedAt=Date.now();
  var keys=Object.keys(S.days).sort();
  while(keys.length>120){var old=keys.shift();foldArch(old);delete S.days[old]}
  writeLocal();
  if(docRef){clearTimeout(saveTimer);saveTimer=setTimeout(flushRemote,1200)}
}
function flushRemote(){
  if(!docRef||!S)return;
  if(saving){again=true;return}
  saving=true;
  docRef.set(JSON.parse(JSON.stringify(S))).then(function(){syncMode="cloud"},function(e){
    if(e&&e.code==="invalid_argument"){docRef=null;syncMode="local"}
  }).then(function(){saving=false;if(again){again=false;flushRemote()}});
}
function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return null;
      var ref;
      try{ref=db.doc("data/users/"+id+"/profile")}catch(e){return null}
      return ref.get().then(function(snap){
        docRef=ref;syncMode="cloud";
        var remote=snap.exists?snap.data():null;
        if(remote&&remote.name&&(!S||!S.name||(remote.updatedAt||0)>(S.updatedAt||0))){
          S=JSON.parse(JSON.stringify(remote));migrate();
          writeLocal();ensureToday();$("#onb").hidden=true;refresh();
        }else if(S&&S.name){flushRemote()}
        if(tab==="journal")renderMain();
      });
    });
  }).catch(function(){});
}

/* ===== Logique ===== */
function buildDay(k){
  var r=rng(hash(k+S.name)),t={};
  if(isPlannedRest(k))return {t:{etire:10,marche:20},p:{},r:{},done:false,dg:[],f:0,restDay:true};
  ["FOR","AGI","END","VIT"].forEach(function(g){
    var list=GROUPS[g],ex=list[Math.floor(r()*list.length)];
    var e=EX[ex],lf=1+Math.min(Math.max(0,S.level-baseLv()),60)*0.025;
    var m=diffM(); if(e.u==="min")m=1+(m-1)*0.5;
    if(S.cls===g)m*=1.2;
    t[ex]=roundU(Math.min(e.b*m*lf,e.cap),e.u);
  });
  return {t:t,p:{},r:{},done:false,dg:[],f:Math.floor(r()*FLAVOR.length)};
}
function ensureToday(){
  if(!S)return;
  ensureWeek();ensureWQ();ensureSeason();
  var k=today();
  if(S.days[k])return;
  var d=buildDay(k);
  var y=addDays(k,-1);
  if(S.created<=y&&!S.days[y]&&isPlannedRest(y))S.days[y]={t:{},p:{},r:{},done:false,dg:[],restDay:true};
  if(S.created<=y&&!(S.days[y]&&(S.days[y].done||S.days[y].rest||S.days[y].restDay))){
    if(S.tokens>0){
      S.tokens--;
      S.days[y]=S.days[y]||{t:{},p:{},r:{},done:false,dg:[]};S.days[y].rest=true;
      note("Jeton de repos utilisé","Tu as manqué la quête d'hier, mais un jeton de repos a protégé ta série. Il t'en reste "+S.tokens+".","gold");
    }else{
      var m=diffM();
      if(skillE("penHalf"))m=m/2;
      d.pen={t:{jj:roundU(50*m,"reps"),gainage:roundU(Math.min(90*m,300),"s")},p:{},done:false};
    }
  }
  for(var ok in S.days)if(ok!==k)stripRc(S.days[ok]);
  S.days[k]=d;save();
}
function ensureWeek(){
  var w=weekKey(today());
  if(S.boss&&S.boss.w===w)return;
  if(S.boss&&!S.boss.won&&S.boss.dmg>0)note("Le boss s'est échappé",S.boss.name+" a survécu à la semaine. Un nouvel adversaire apparaît.","red");
  var left=7-((new Date().getDay()+6)%7);
  var hp=600*diffM()*(1+Math.min(S.level-1,60)*0.05)*left/7;
  S.boss={w:w,name:BOSSES[hash(w+S.name)%BOSSES.length],hp:Math.max(100,Math.round(hp/10)*10),dmg:0,won:false};
}
function skillE(k){if(!S.cls)return 0;var b=0,L=SKILLS[S.cls];for(var i=0;i<S.skills&&i<L.length;i++){if(L[i].e[k])b+=L[i].e[k]}return b}
function spAvail(){return S.cls?Math.max(0,Math.floor(S.level/5)-1)-S.skills:0}
function tokMax(){return skillE("tokMax")||3}
function itemById(id){for(var i=0;i<S.inv.length;i++)if(S.inv[i].id===id)return S.inv[i];return null}
function compBonus(t){
  var b=0;for(var n in S.comp){if(COMP[n]&&COMP[n].t===t)b+=COMP[n].v*S.comp[n]}
  for(var sl in S.eq){var it=itemById(S.eq[sl]);if(it&&it.t===t)b+=RAR[it.r].v}
  return b+skillE(t);
}
function diffM(){return S.calib?S.calib.m:DIFF[S.diff]["m"]}
function baseLv(){return S.calib?S.calib.lv:1}
function daysBetween(a,b){var pa=a.split("-"),pb=b.split("-");return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2])-new Date(+pa[0],+pa[1]-1,+pa[2]))/86400000)}
function examAvail(){var l=S.exams[S.exams.length-1];return !l||daysBetween(l.d,today())>=28}
function monthKey(){return today().slice(0,7)}
function seasonName(m){return SEASONS[+(m||monthKey()).slice(5,7)-1]}
function seasonSkin(m){return SEASON_SKIN[(+(m||monthKey()).slice(5,7)-1)%4]}
function ensureSeason(){
  var m=monthKey();
  if(S.season&&S.season.m===m)return;
  var first=!S.season;
  S.season={m:m,xp:0,pal:0,boss:false,rc:{}};
  if(!first)note("Nouvelle saison",seasonName(m)+" commence. 30 paliers à gravir, un gardien à vaincre et des récompenses exclusives.","gold",seasonName(m).replace("Saison ",""));
  if(skillE("monthTok")&&S.lastMonthTok!==m){S.lastMonthTok=m;addToken();note("Seconde peau","Nouveau mois : ton talent de Gardien t'offre un jeton de repos.","gold")}
}
function palReward(p){
  if(p===5||p===15)chest(1,"Coffre de palier "+p);
  else if(p===10){addToken();note("Palier 10","Récompense de saison : un jeton de repos.","gold")}
  else if(p===20){chest(2,"Coffre de palier 20");note("Palier 20","Le gardien de la saison t'attend dans l'onglet Donjons.","gold")}
  else if(p===25){addPts(1);note("Palier 25","Récompense de saison : 1 point de caractéristique.","gold")}
  else if(p===30){
    var sk=seasonSkin(S.season.m),yr=S.season.m.slice(0,4),tt="Champion de la "+seasonName(S.season.m)+" "+yr;
    var rt=rcTop();
    if(S.skins.indexOf(sk)===-1){S.skins.push(sk);if(rt)rt.skins.push(sk)}
    if(S.stitles.indexOf(tt)===-1){S.stitles.push(tt);if(rt)rt.titles.push(tt)}
    chest(3,"Coffre de fin de saison");
    note("Saison accomplie","Titre exclusif « "+tt+" » et thème de couleur "+SKINS[sk].n+" débloqués. Équipe le dans la boutique.","gold",30);
  }
  else addGold(25);
}
function seasonGain(n){
  if(!S.season)return;
  S.season.xp+=n;
  var np=Math.min(30,Math.floor(S.season.xp/PAL_XP));
  while(S.season.pal<np){S.season.pal++;rcOpen();palReward(S.season.pal);if(!S.season.rc)S.season.rc={};S.season.rc[S.season.pal]=rcClose()}

function seasonLose(n){
  if(!S.season)return;
  S.season.xp=Math.max(0,S.season.xp-n);

  while(S.season.pal>np){var R=S.season.rc&&S.season.rc[S.season.pal];if(!R)break;delete S.season.rc[S.season.pal];undoRc(R);S.season.pal--}
}
function seasonBoss(){
  if(!S.season||S.season.pal<20)return null;
  var ri=rankIdx(S.level),b=DUNGEONS[ri],sn=seasonName();
  return {id:"sboss",r:ri,n:"Gardien "+sn.replace("Saison ",""),rounds:b.rounds+4,work:b.work,rest:Math.max(10,b.rest-5),moves:b.moves,xp:Math.round(b.xp*2.5),season:true};
}
function ensureWQ(){
  var w=weekKey(today());
  if(S.wq&&S.wq.w===w)return;
  var r=rng(hash(w+"wq"+S.name)),pool=WQ_POOL.slice(),ids=[],t={};
  while(ids.length<3){var q=pool.splice(Math.floor(r()*pool.length),1)[0];ids.push(q.id);
    var v=q.b;if(q.sc===1)v=v*diffM();if(q.sc===2)v=v*(1+Math.min(S.level-1,60)*0.04);
    t[q.id]=v>=100?Math.round(v/50)*50:Math.round(v)}
  var left=7-((new Date().getDay()+6)%7);
  if(left<7)ids.forEach(function(id){if(id!=="quests")t[id]=Math.max(1,Math.round(t[id]*left/7/(t[id]>=100?50:1))*(t[id]>=100?50:1));else t[id]=Math.min(t[id],left)});
  S.wq={w:w,ids:ids,t:t,c:{},done:{},chest:false,rc:{}};
}
function track(m,n,raw){
  if(!S.wq||!n)return;
  var rt=rcTop();if(rt&&!raw)rt.trk[m]=(rt.trk[m]||0)+n;
  var wq=S.wq;if(!wq.rc)wq.rc={};
  wq.c[m]=Math.max(0,(wq.c[m]||0)+n);
  if(n<0){
    wq.ids.forEach(function(id){
      if(wq.done[id]&&wq.rc[id]&&(wq.c[id]||0)<wq.t[id]){
        if(wq.chest&&wq.rcC){wq.chest=false;var RC0=wq.rcC;wq.rcC=null;undoRc(RC0)}
        wq.done[id]=false;var R=wq.rc[id];delete wq.rc[id];undoRc(R);
        note("Quête de la semaine",wqLabel(id)+" : l'objectif n'est plus atteint après ta correction. Les 60 or sont repris.","red");
      }
    });
    return;
  }
  wq.ids.forEach(function(id){
    if(!wq.done[id]&&(wq.c[id]||0)>=wq.t[id]){wq.done[id]=true;rcOpen();note("Quête de la semaine",wqLabel(id)+" : objectif atteint. +60 or.","gold");addGold(60,true);wq.rc[id]=rcClose()}
  });
  if(!wq.chest&&wq.ids.every(function(id){return wq.done[id]})){wq.chest=true;rcOpen();rcCnt("wqAll",1);chest(1,"Coffre de la semaine");wq.rcC=rcClose()}
}
function wqLabel(id){var q=WQ_POOL.filter(function(x){return x.id===id})[0];return q.n.replace("{t}",S.wq.t[id].toLocaleString("fr-FR"))}
function chest(minR,src){
  var w=[60,28,10,2],luck=skillE("luck");
  for(var l=0;l<luck;l++)w=[w[0]*.6,w[1]*1.2,w[2]*1.6,w[3]*2];
  for(var i=0;i<minR;i++)w[i]=0;
  var tot=w.reduce(function(a,b){return a+b},0),x=Math.random()*tot,r=0;
  while(x>w[r]){x-=w[r];r++}
  var slots=Object.keys(SLOTS),sl=slots[Math.floor(Math.random()*slots.length)],bk=Object.keys(BON),t=bk[Math.floor(Math.random()*bk.length)];
  var base=SLOTS[sl].b[Math.floor(Math.random()*SLOTS[sl].b.length)];
  var it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),sl:sl,n:base+" "+BON[t].s,r:r,t:t};
  if(r===3){if(!S.hadLeg&&rcTop())rcTop().leg=true;S.hadLeg=true;say("Objet légendaire !",true)}
  if(S.inv.length>=30){var gd=addGold(RAR[r].sell);note(src,"Inventaire plein : "+it.n+" ("+RAR[r].n.toLowerCase()+") a été vendu pour "+gd+" or.","r"+r);return}
  S.inv.push(it);if(rcTop())rcTop().items.push(it.id);
  note(src,it.n+" ("+RAR[r].n.toLowerCase()+") : +"+RAR[r].v+" % "+BON[t].d+". Équipe le depuis ton inventaire.","r"+r,r>=2?RAR[r].n:null);
}
function addGold(n,noTrack){n=Math.round(n*(1+compBonus("gold")/100));S.gold+=n;S.goldTotal+=n;var rt=rcTop();if(rt)rt.gold+=n;if(!noTrack)track("gold",n);return n}
function isPlannedRest(k){return S.restDays.indexOf(wdOf(k))>-1}
function rift(){
  var k=today(),r=rng(hash(k+"rift"+S.name));
  if(r()>=0.5)return null;
  var h=7+Math.floor(r()*12),st=new Date();st.setHours(h,0,0,0);var en=new Date(st);en.setHours(h+4);
  var ri=rankIdx(S.level),b=DUNGEONS[ri];
  return {id:"rift",r:ri,n:RIFTS[Math.floor(r()*RIFTS.length)],rounds:b.rounds+2,work:b.work,rest:Math.max(10,b.rest-5),moves:b.moves,xp:b.xp*2,start:st,end:en,rift:true};
}
function riftState(){var g=rift();if(!g)return "none";var n=new Date();if(dayObj().dg.indexOf("rift")>-1)return "done";return n<g.start?"soon":n<g.end?"open":"closed"}
function addToken(){var b=S.tokens;S.tokens=Math.min(tokMax(),S.tokens+1);var rt=rcTop();if(rt)rt.tok+=S.tokens-b}
function dmgOf(ex,delta){var e=EX[ex],u=e.u;return e.rec?delta*2:u==="s"?delta/4:u==="min"?delta*8:delta}
function hitBoss(n,raw){
  var b=S.boss;if(!b||!n)return 0;
  if(n>0&&b.won)return 0;
  var eff=raw?n:n*(1+compBonus("dmg")/100);
  if(n>0&&rcTop())rcTop().dmg+=eff;
  track("dmg",eff,true);
  if(b.won){
    var tot=b.hp+(b.over||0)+eff;
    if(tot>=b.hp||!b.rc){b.over=Math.max(0,tot-b.hp);return eff}
    b.won=false;b.over=0;b.dmg=Math.max(0,tot);
    var RB=b.rc;b.rc=null;undoRc(RB);
    note("Boss ranimé","Après ta correction, les dégâts ne suffisent plus : "+b.name+" se relève et les récompenses de sa défaite sont reprises.","red");
    return eff;
  }
  b.dmg=Math.max(0,b.dmg+eff);
  if(b.dmg>=b.hp){
    b.over=b.dmg-b.hp;b.dmg=b.hp;b.won=true;rcOpen();rcCnt("bossWins",1);addPts(2);addToken();
    var xp=150+S.level*5,gd=addGold(150);
    say(b.name+" est vaincu.",true);
    note("Boss vaincu",b.name+" est tombé. Tu gagnes "+xp+" XP, "+gd+" or, 2 points de caractéristique et 1 jeton de repos.","gold");
    if(COMP[b.name]){
      var lv=S.comp[b.name]||0;
      if(lv<3){S.comp[b.name]=lv+1;if(rcTop())rcTop().comp.push(b.name);var c=COMP[b.name];
        note(lv?"Compagnon renforcé":"Nouveau compagnon",lv?b.name+" passe au niveau "+(lv+1)+". Son bonus monte à +"+(c.v*(lv+1))+" % sur "+c.d+".":b.name+" rejoint tes rangs. Bonus permanent : +"+c.v+" % sur "+c.d+".","gold")}
    }
    chest(1,"Butin de "+b.name);
    gainXP(xp);
    b.rc=rcClose();
  }

function exRow(kind,ex,target,val,locked){
  var e=EX[ex],ok=val>=target,pct=Math.min(100,val/target*100),cap=target*2,dis=locked?" disabled":"",full=val>=cap;
  var steps=e.u==="reps"?[1,5,10]:e.u==="min"?[1,5]:[15,30];
  var minus=e.u==="reps"?1:e.u==="min"?1:15;
  var h='<div class="ex"><div class="ex-top"><span class="ex-n">'+e.n+'<button class="q" data-a="tip" data-m="'+esc(e.n)+'" aria-label="Comment faire">?</button>'+(kind==="q"?'<small>'+statName(e.s)+'</small>':'')+'</span>'+
    '<span class="ex-c'+(ok?" ok":"")+'">'+fmtU(val,e.u)+' / '+fmtU(target,e.u)+'</span></div>'+
    '<div class="bar'+(ok?" full":"")+'"><i style="width:'+pct+'%"></i></div><div class="ex-btns">'+
    '<button class="minus" data-a="add" data-k="'+kind+'" data-e="'+ex+'" data-v="'+(-minus)+'" aria-label="Retirer"'+(locked||!val?" disabled":"")+'>−</button>';
  if(e.u==="s"){
    var on=chrono&&chrono.kind===kind&&chrono.ex===ex;
    h+='<button class="chrono'+(on?" on":"")+'" data-a="chrono" data-k="'+kind+'" data-e="'+ex+'"'+(locked||(full&&!on)?" disabled":"")+'><span id="'+(on?"chronoLbl":"")+'">'+(on?"Arrêter":"Chrono")+'</span></button>';
  }
  steps.forEach(function(s){h+='<button data-a="add" data-k="'+kind+'" data-e="'+ex+'" data-v="'+s+'"'+(locked||full?" disabled":"")+'>+'+(e.u==="reps"?s:fmtU(s,e.u))+'</button>'});
  h+='</div>';
  if(full&&!locked)h+='<p class="ex-max">Maximum atteint : le double de l\'objectif.</p>';
  return h+'</div>';
}

function startDungeon(id){
  var g=id==="rift"?(riftState()==="open"?rift():null):id==="sboss"?(S.season&&!S.season.boss?seasonBoss():null):DUNGEONS.concat([TRIAL]).filter(function(x){return x.id===id})[0];

  for(var r=1;r<=g.rounds;r++){
    ph.push({type:"work",dur:g.work,move:g.moves[(r-1)%g.moves.length],r:r});
    if(r<g.rounds)ph.push({type:"rest",dur:g.rest,next:g.moves[r%g.moves.length],r:r});
  }
  run={g:g,ph:ph,i:0,left:ph[0].dur*1000,last:performance.now(),paused:false,sec:null};
  $("#runName").textContent=g.id==="trial"||g.season?g.n:g.rift?"Portail instable : "+g.n:"Portail de rang "+RANKS[g.r]+" : "+g.n;
  $("#runPauseBtn").textContent="Pause";
  $("#run").hidden=false;reqWake();beep(520,.2);

function runTick(){
  if(!run)return;
  var now=performance.now();
  if(run.paused){run.last=now;return}
  run.left-=now-run.last;run.last=now;
  if(run.left<=0){
    run.i++;
    if(run.i>=run.ph.length){endRun(true);return}
    var p=run.ph[run.i];run.left=p.dur*1000;
    if(p.type==="work"){beep(990,.3,.16);buzz([200,80,200]);say((p.r===run.g.rounds?"Dernier round. ":"")+p.move+" !",true)}
    else{beep(440,.4,.14);buzz(400);say("Repos. Ensuite, "+p.next+".",true)}
  }
  var s=Math.ceil(run.left/1000);
  if(s!==run.sec){run.sec=s;if(s<=3&&s>0)beep(740,.07,.1);
    var cp=run.ph[run.i];if(cp.type==="work"&&cp.dur>=30&&s===10)say("Encore dix secondes.")}
  drawRun();
}
function drawRun(){
  var p=run.ph[run.i],pct=run.left/(p.dur*1000),col=p.type==="work"?"var(--accent)":p.type==="rest"?"var(--muted)":"var(--gold)";
  $("#runNum").textContent=Math.max(0,Math.ceil(run.left/1000));

  $("#runArc").setAttribute("stroke-dashoffset",String(565.49*(1-pct)));
  $("#runPhase").textContent=p.type==="work"?p.move:p.type==="rest"?"Repos":"En position";
  $("#runPhase").style.color=col;
  $("#runRound").textContent=p.type==="prep"?"Le portail s'ouvre":"Round "+p.r+" sur "+run.g.rounds;
  $("#runNext").textContent=p.next?"Ensuite : "+p.next:"";

    d.dg.push(g.id);S.dgCount++;if(g.id==="s")S.dgS=true;if(g.rift)S.unstableDone++;
    var xp=Math.round(g.xp*(1+(compBonus("dg")+(g.rift?skillE("riftXp"):0))/100)),gd=addGold(g.rift?g.xp/2:g.xp/4),dm=g.rift?g.xp*2:g.xp;

    gainXP(xp);hitBoss(dm);track("dg",1);
    if(g.rift)chest(1,"Coffre de la faille");else if(Math.random()<0.6)chest(0,"Coffre du donjon");
    checkAch();save();
  }else note("Donjon nettoyé","Bel entraînement. La récompense de ce portail a déjà été prise aujourd'hui.","");

      '<div class="note-s">Ton niveau actuel</div><div class="seg">';
    Object.keys(DIFF).forEach(function(k){h+='<button class="'+(obDiff===k?"on":"")+'" data-a="obdiff" data-d="'+k+'">'+DIFF[k].n+'</button>'});
    h+='</div><p class="note-s" style="margin-top:-4px">Débutant : environ 10 pompes et 20 squats pour commencer. Les objectifs grimpent avec ton niveau.</p>'+
      '<button class="btn" data-a="obgo">Commencer l\'éveil</button>';
    w.innerHTML=h;
  }
  $("#onb").hidden=false;
}

/* ===== Interactions ===== */
var resetArmed=false;
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a;
  if(a==="tab"){tab=b.dataset.t;window.scrollTo(0,0);refresh()}
  else if(a==="add")addProg(b.dataset.k,b.dataset.e,+b.dataset.v)
  else if(a==="chrono")toggleChrono(b.dataset.k,b.dataset.e)
  else if(a==="stat"){if(S.points>0){S.points--;S.stats[b.dataset.s]++;beep(1000,.06,.08);save();renderMain()}}
  else if(a==="noteok")nextNote()
  else if(a==="clspick")showClass()
  else if(a==="skill"){if(spAvail()>0&&S.skills<4){var sk=SKILLS[S.cls][S.skills];S.skills++;sfxLevel();note("Compétence débloquée",sk.n+" : "+sk.d+".","gold");save();refresh()}}
  else if(a==="equip"){var it=itemById(b.dataset.i);if(it){S.eq[it.sl]=it.id;beep(1000,.06,.08);save();renderMain()}}
  else if(a==="unequip"){var it2=itemById(b.dataset.i);if(it2&&S.eq[it2.sl]===it2.id){delete S.eq[it2.sl];save();renderMain()}}
  else if(a==="sell"){var it3=itemById(b.dataset.i);if(it3&&S.eq[it3.sl]!==it3.id){S.inv=S.inv.filter(function(x){return x.id!==it3.id});S.gold+=RAR[it3.r].sell;S.goldTotal+=RAR[it3.r].sell;beep(1320,.06,.08);save();refresh()}}
  else if(a==="life")toggleLife(b.dataset.k)
  else if(a==="exgo"){
    var ek=b.dataset.k,ed=EXAMS.filter(function(x){return x.k===ek})[0];
    if(exT&&exT.k===ek&&exT.mode==="hold"){var secs=Math.floor((Date.now()-exT.start)/1000);exT=null;exVals[ek]=secs;$("#exV_"+ek).value=secs;b.textContent="Recommencer le chrono";beep(990,.3,.14);say("Chrono arrêté. "+secs+" secondes.",true);return}
    if(exT)return;
    exT={k:ek,mode:ed.mode,start:Date.now()};beep(880,.2);say(ed.mode==="hold"?"En position. Tiens bon.":"Top départ !",true);exTick();
  }
  else if(a==="exsave"){
    var vals={},okv=true;
    EXAMS.forEach(function(e){var v=parseInt(($("#exV_"+e.k)||{}).value,10);if(isNaN(v)||v<0)okv=false;vals[e.k]=v});
    if(!okv){note("Examen incomplet","Remplis les trois résultats avant de valider. Mets 0 si tu n'as pas pu faire un test.","red");return}
    var prev=S.exams[S.exams.length-1];
    var cm=(vals.p/15+vals.s/30+vals.g/60)/3;cm=Math.max(.6,Math.min(4,cm));
    S.exams.push({d:today(),p:vals.p,s:vals.s,g:vals.g,lv:S.level});S.calib={m:Math.round(cm*100)/100,lv:S.level};exVals={};exT=null;
    var msg=EXAMS.map(function(e){var dv=prev?vals[e.k]-prev[e.k]:null;return e.n.split(" ")[0]+" : "+fmtEx(e.k,vals[e.k])+(dv>0?" (+"+fmtEx(e.k,dv)+")":"")}).join(", ");
    var ge=addGold(50);note("Examen terminé",msg+". Tes quêtes sont recalibrées dès demain. 100 XP et "+ge+" or.","gold");gainXP(100);
    tab="stats";checkAch();save();refresh();
  }
  else if(a==="buy"){
    var it=b.dataset.i,pr={potion:120,token:200,point:180}[it];
    if(!pr||S.gold<pr)return;
    if(it==="potion"){if(S.boost===today())return;S.boost=today();note("Potion bue","Toute l\'XP gagnée aujourd\'hui est doublée jusqu\'à minuit.","gold")}
    else if(it==="token"){if(S.tokens>=tokMax())return;addToken();note("Jeton acheté","Tu as maintenant "+S.tokens+" jeton"+(S.tokens>1?"s":"")+" de repos.","gold")}
    else{S.points++;note("Élixir bu","1 point de caractéristique à répartir dans ton statut.","gold")}
    S.gold-=pr;S.bought++;beep(1320,.08,.08);checkAch();save();refresh();
  }
  else if(a==="buyskin"){var k2=b.dataset.k,sk=SKINS[k2];if(!sk||S.skins.indexOf(k2)>-1||S.gold<sk.p)return;
    S.gold-=sk.p;S.skins.push(k2);S.skin=k2;S.bought++;beep(1320,.08,.08);note("Thème débloqué","Le thème "+sk.n+" est équipé. Tu peux changer de thème quand tu veux dans la boutique.","gold");checkAch();save();refresh()}
  else if(a==="skin"){if(S.skins.indexOf(b.dataset.k)>-1){S.skin=b.dataset.k;save();refresh()}}
  else if(a==="restday"){var w=+b.dataset.w,ix=S.restDays.indexOf(w);
    if(ix>-1)S.restDays.splice(ix,1);else if(S.restDays.length<2)S.restDays.push(w);else{note("Deux jours maximum","Retire d\'abord un jour de repos pour en choisir un autre.","");return}
    save();renderMain()}
  else if(a==="cls"){
    var c=b.dataset.c;if(S.cls||!CLASSES[c])return;
    S.cls=c;S.stats[c]+=5;$("#onb").hidden=true;sfxLevel();say("Tu es désormais "+CLASSES[c].n+".",true);
    note("Classe obtenue",CLASSES[c].d+" Ta caractéristique "+statName(c)+" gagne 5 points. L'effet s'applique dès ta prochaine quête.","gold",CLASSES[c].n);
    checkAch();save();refresh();
  }
  else if(a==="voice"){S.voice=b.dataset.v==="1";save();renderMain();if(S.voice)say("Voix du Système activée.",true)}
  else if(a==="export"){
    var code="ASC1."+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    var ta=$("#xfer");ta.value=code;ta.focus();ta.select();
    var ok=function(){note("Code copié","Colle le dans le champ « Transférer ma progression » de l'autre version, puis touche Importer le code.","")};
    var ko=function(){note("Code prêt","Le code est sélectionné dans le champ. Maintiens le doigt dessus puis choisis Copier.","")};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(ok,ko);else{document.execCommand("copy")?ok():ko()}}catch(e){ko()}
  }
  else if(a==="import"){
    var raw=($("#xfer").value||"").trim(),data=null;
    try{data=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/^ASC1\./,"")))))}catch(e){}
    if(!data||!data.name||!data.level||!data.days){note("Code invalide","Ce code n'est pas une sauvegarde Ascension. Vérifie qu'il a été copié en entier.","red");return}
    S=data;migrate();ensureToday();save();refresh();
    note("Progression importée","Bon retour, "+S.name+". Niveau "+S.level+", rang "+RANKS[rankIdx(S.level)]+".","gold");
  }
  else if(a==="tip"){var m=b.dataset.m;note(m,m==="Jetons de repos"?"Si tu rates une quête, un jeton est utilisé automatiquement le lendemain : pas de pénalité et ta série continue. Tu en gagnes un tous les 7 jours de série et à chaque boss vaincu. Maximum 3.":(TIPS[m]||""),"")}
  else if(a==="sound"){S.sound=b.dataset.v==="1";save();renderMain();if(S.sound)beep(880,.1)}
  else if(a==="dg")startDungeon(b.dataset.g)
  else if(a==="runpause"){run.paused=!run.paused;b.textContent=run.paused?"Reprendre":"Pause";if(run.paused){hush();say("Pause.")}else say("C'est reparti.")}
  else if(a==="runstop")endRun(false)
  else if(a==="diff"){S.diff=b.dataset.d;S.calib=null;save();renderMain()}
  else if(a==="reset"){
    if(!resetArmed){resetArmed=true;b.textContent="Toucher encore pour tout effacer";setTimeout(function(){resetArmed=false;var r=$("#resetBtn");if(r)r.textContent="Recommencer à zéro"},4000)}
    else{resetArmed=false;var old=S;S=null;try{localStorage.removeItem(LS)}catch(e){}
      if(docRef)docRef.delete().catch(function(){});tab="statut";refresh();showOnb(1)}
  }
  else if(a==="obno"){$("#obMsg").textContent="Refus impossible. Le Système a déjà fait son choix.";var w=$("#onbWin");w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake");buzz(120)}
  else if(a==="obyes"){beep(880,.15);showOnb(2)}
  else if(a==="obdiff"){obDiff=b.dataset.d;var nm=$("#obName").value;showOnb(2);$("#obName").value=nm}
  else if(a==="obgo"){
    var name=($("#obName").value||"").trim();
    if(!name){$("#obName").focus();$("#obName").placeholder="Il te faut un nom";return}
    S=newState(name,obDiff);migrate();ensureToday();save();$("#onb").hidden=true;sfxLevel();
    refresh();note("Bienvenue, "+name,"Ta première quête journalière t'attend. Tu as jusqu'à minuit.","");
    if(docRef)flushRemote();
  }
});

document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.ex)exVals[t.dataset.ex]=t.value;
  if(t.id==="remTime"&&S){S.remTime=t.value||"18:00";save();var l=$("#remLink");if(l)l.href=calURL()}
});
/* ===== Démarrage ===== */
S=loadLocal();migrate();
if(S&&S.name){ensureToday();reconcileToday();refresh();if(S.trialDone&&!S.cls)showClass()}else{S=null;refresh();showOnb(1)}
initCloud();
if("serviceWorker" in navigator){
  var hadCtrl=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadCtrl&&!reloaded&&!run){reloaded=true;location.reload()}});
  window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(function(r){try{r.update()}catch(e){}}).catch(function(){})});
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S){tickClock()}});
})();
</script>
</body>
